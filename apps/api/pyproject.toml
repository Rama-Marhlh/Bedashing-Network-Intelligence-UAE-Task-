[project]
name = "bedashing-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-ai-slim[ag-ui,openai]>=0.8,<1",
  "opentelemetry-api==1.38.0",
  "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedashing_api"]
